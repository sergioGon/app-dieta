name: cron probe (temporal, diagnostico)

# Reconfigurada 2026-07-31 tras red-team: horaria a minuto valle (:29), no */5
# (los eventos schedule pueden descartarse bajo carga y */5 es lo mas expuesto).
# CONGELADA hasta 2026-08-03: cada edicion re-registra el workflow y reinicia
# el reloj del planificador (#185373). NO editar, NO borrar hasta veredicto.

on:
  schedule:
    - cron: "29 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "event=${{ github.event_name }}"
          date -u +%FT%TZ
