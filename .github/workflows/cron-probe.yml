name: cron probe (temporal, diagnostico)

# Diagnostico temporal creado 2026-07-31 para aislar por que los crons no
# disparan en el repo privado sergioGon/spain-tax. Mismo cron, repo publico,
# misma cuenta y mismo plan. Se borra en cuanto haya veredicto.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "event=${{ github.event_name }}"
          date -u +%FT%TZ
